apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing: reads a keystore.properties (storeFile, storePassword, keyAlias, keyPassword) from the path in the
// MODHUB_KEYSTORE_PROPS environment variable, or ./keystore.properties in the project root. The file and the key are never
// committed. Without them the release build falls back to the debug key, so anyone can still build the project.
def ksProps = new Properties()
def ksFile = System.getenv('MODHUB_KEYSTORE_PROPS') ? new File(System.getenv('MODHUB_KEYSTORE_PROPS')) : rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def hasRelease = ksProps['storeFile'] != null

android {
    namespace 'us.fishfarts.modhub'
    compileSdkVersion versions.compileSdk
    compileOptions {
        sourceCompatibility versions.java
        targetCompatibility versions.java
    }
    kotlinOptions { jvmTarget = '11' }
    buildFeatures {
        compose true
        buildConfig true
    }
    defaultConfig {
        applicationId "us.fishfarts.modhub"
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
        versionCode 26
        versionName "1.7"
    }
    signingConfigs {
        if (hasRelease) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
            signingConfig hasRelease ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
}
